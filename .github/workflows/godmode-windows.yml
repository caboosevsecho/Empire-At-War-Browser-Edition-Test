name: Build Space God Mode (experimental)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Apply player-only space damage patch and isolate installation
        shell: python
        run: |
          from pathlib import Path
          import json
          p = Path('public/js/game/sim.js')
          s = p.read_text(encoding='utf-8')
          needle = 'if (target.dead || target.hyper || target.invulnerable || target.limbo) return;'
          anchor = s.index('  applyDamage(')
          pos = s.index(needle, anchor)
          s = s[:pos] + 'if (target.player?.human) return;\n    ' + s[pos:]
          p.write_text(s, encoding='utf-8')
          c = Path('src-tauri/tauri.conf.json')
          cfg = json.loads(c.read_text(encoding='utf-8'))
          cfg['productName'] = 'Empire at War Browser Edition God Mode'
          cfg['identifier'] = 'com.playeaw.browseredition.godmode'
          cfg['mainBinaryName'] = 'Empire at War Browser Edition God Mode'
          cfg['plugins']['updater']['endpoints'] = []
          cfg['bundle']['createUpdaterArtifacts'] = False
          c.write_text(json.dumps(cfg, indent=2) + '\n', encoding='utf-8')
          print('Patched space damage; updater artifact signing disabled; separate app identity configured.')
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run app
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Browser-Edition-Space-GodMode-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
